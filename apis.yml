aid: pega
name: Pega
description: >-
  Pega (Pegasystems) is an enterprise low-code platform for AI-powered decisioning
  and workflow automation, spanning business process management (BPM), CRM, and
  customer engagement across financial services, insurance, healthcare, government,
  and manufacturing. External systems integrate with Pega Platform and Pega
  Launchpad through the Constellation Digital Experience (DX) API — a REST + OAuth
  2.0 surface for creating and driving cases and data objects — and through
  first-party SDKs (React, Angular, Web Components, Mobile) that render Constellation
  DX Components. Pega also publishes first-party Agent Skills for building on
  Launchpad.
